<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$he$endif$" dir="$if(dir)$$dir$$else$rtl$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(title)$$title$$else$$pagetitle$$endif$</title>
  <style>
    :root {
      --ink:        #14213d;
      --muted:      #4a5b78;
      --accent:     #1e40af;
      --accent-2:   #3b82f6;
      --line:       #cbd5e1;
      --line-soft:  #e2e8f0;
      --callout-bg: #eff6ff;
      --code-bg:    #f1f5f9;
      --code-br:    #dbe3ec;
      --paper:      #ffffff;
      --stage-bg:   #0b1220;
      --sans: "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, -apple-system, sans-serif;
      --mono: "Cascadia Mono", "Consolas", "JetBrains Mono", "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--stage-bg);
      font-family: var(--sans);
      color: var(--ink);
      overflow: hidden;
    }

    /* ===== Stage: fixed 16:9, scaled to fit the viewport ===== */
    #stage {
      position: absolute;
      top: 50%; left: 50%;
      width: 1280px; height: 720px;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
      transform-origin: center center;
      background: var(--paper);
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      overflow: hidden;
    }

    /* ===== Slides ===== */
    section.level1, #title-slide {
      position: absolute;
      inset: 0;
      padding: 62px 76px 78px;
      display: none;
      flex-direction: column;
      background: var(--paper);
    }
    section.level1.current, #title-slide.current { display: flex; }

    .slide-inner { flex: 1 1 auto; min-height: 0; font-size: 26px; line-height: 1.6; }

    section.level1 > h1 {
      font-size: 44px;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 26px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--accent-2);
      line-height: 1.2;
    }

    .slide-inner p { margin: 0 0 18px; }
    .slide-inner strong { font-weight: 700; color: var(--ink); }
    .slide-inner ul, .slide-inner ol { margin: 0 0 18px; padding-inline-start: 34px; }
    .slide-inner li { margin-bottom: 13px; }
    .slide-inner li > ul, .slide-inner li > ol { margin-top: 12px; }
    .slide-inner hr { border: 0; border-top: 1px solid var(--line-soft); margin: 22px 0; }
    .slide-inner a { color: var(--accent); }

    /* Code keeps its own direction inside RTL prose */
    code, pre { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); }
    .slide-inner code {
      background: var(--code-bg);
      border: 1px solid var(--code-br);
      border-radius: 5px;
      padding: 1px 7px;
      font-size: .85em;
      color: #0f172a;
    }
    .slide-inner pre {
      background: var(--code-bg);
      border: 1px solid var(--code-br);
      border-radius: 9px;
      padding: 16px 20px;
      font-size: 21px;
      line-height: 1.55;
      overflow-x: auto;
      text-align: left;
      margin: 0 0 18px;
    }
    .slide-inner pre code { background: none; border: 0; padding: 0; font-size: 1em; }

    .slide-inner blockquote {
      margin: 18px 0;
      padding: 16px 22px;
      background: var(--callout-bg);
      border-inline-start: 6px solid var(--accent-2);
      border-radius: 8px;
      border-start-start-radius: 0;
      border-end-start-radius: 0;
      color: #1e3a5f;
    }
    .slide-inner blockquote > :last-child { margin-bottom: 0; }

    .slide-inner table { width: 100%; border-collapse: collapse; margin: 6px 0 18px; font-size: 24px; }
    .slide-inner th, .slide-inner td {
      border: 1px solid var(--line);
      padding: 11px 16px;
      text-align: start;
      vertical-align: top;
    }
    .slide-inner thead th { background: var(--accent); color: #fff; font-weight: 600; }
    .slide-inner tbody tr:nth-child(even) { background: #f8fafc; }

    /* ===== Title slide ===== */
    #title-slide { align-items: center; justify-content: center; text-align: center; }
    #title-slide img { max-width: 300px; margin-bottom: 34px; }
    #title-slide .course { font-size: 21px; color: var(--muted); font-weight: 700; margin-bottom: 20px; }
    #title-slide h1 {
      font-size: 62px; font-weight: 700; color: var(--accent);
      margin: 0; line-height: 1.18; border: 0; padding: 0;
    }
    #title-slide .sub { font-size: 29px; color: var(--muted); margin-top: 18px; }
    #title-slide .author { font-size: 21px; color: var(--muted); margin-top: 40px; }

    /* ===== Chrome: progress, counter, hint ===== */
    #progress {
      position: absolute; bottom: 0; inset-inline-start: 0;
      height: 5px; background: var(--accent-2); width: 0;
      transition: width .18s ease;
    }
    #counter {
      position: absolute; bottom: 22px; inset-inline-end: 34px;
      font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    #brand {
      position: absolute; bottom: 22px; inset-inline-start: 34px;
      font-size: 15px; color: #94a3b8;
    }
    #title-slide #counter, #title-slide #brand { display: none; }

    /* ===== Overview grid ===== */
    #overview {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(11,18,32,.97);
      overflow-y: auto; padding: 34px;
      display: none; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px;
    }
    #overview.open { display: grid; }
    .ov-card {
      background: var(--paper); border-radius: 9px; padding: 15px 17px; cursor: pointer;
      border: 3px solid transparent; min-height: 104px;
    }
    .ov-card:hover { border-color: var(--accent-2); }
    .ov-card .n { font-size: 12px; color: #94a3b8; font-weight: 700; margin-bottom: 7px; }
    .ov-card .t { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.35; }

    #help {
      position: fixed; inset-inline-end: 16px; top: 14px; z-index: 60;
      font-size: 13px; color: #64748b; background: rgba(255,255,255,.92);
      padding: 7px 13px; border-radius: 7px; opacity: 0; transition: opacity .25s;
      pointer-events: none;
    }
    body:hover #help { opacity: 1; }

    /* ===== Print: one slide per landscape page ===== */
    @media print {
      @page { size: 1280px 720px; margin: 0; }
      body { background: #fff; overflow: visible; }
      #stage {
        position: static; transform: none; width: 1280px; height: auto;
        box-shadow: none;
      }
      section.level1, #title-slide {
        position: relative; inset: auto; display: flex !important;
        width: 1280px; height: 720px;
        page-break-after: always; break-after: page;
        border-bottom: 1px solid #e2e8f0;
      }
      #overview, #help, #progress, #counter, #brand { display: none !important; }
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="title-slide" class="current">
$if(logo)$    <img src="$logo$" alt="">
$endif$$if(course)$    <div class="course">$course$</div>
$endif$    <h1>$if(title)$$title$$else$$pagetitle$$endif$</h1>
$if(subtitle)$    <div class="sub">$subtitle$</div>
$endif$$if(author)$    <div class="author">$for(author)$$author$$sep$ · $endfor$</div>
$endif$  </div>

$body$

  <div id="progress"></div>
  <div id="counter"></div>
  <div id="brand">$if(course)$$course$$endif$</div>
</div>

<div id="overview"></div>
<div id="help">← → ניווט · O סקירה · F מסך מלא</div>

<script>
(function () {
  var stage = document.getElementById('stage');

  // Wrap each slide's body (everything after its h1) so it can be auto-fitted.
  var slides = [document.getElementById('title-slide')];
  Array.prototype.forEach.call(document.querySelectorAll('#stage > section.level1'), function (sec) {
    var inner = document.createElement('div');
    inner.className = 'slide-inner';
    var n = sec.firstChild;
    var move = [];
    while (n) { if (!(n.nodeType === 1 && n.tagName === 'H1')) move.push(n); n = n.nextSibling; }
    move.forEach(function (node) { inner.appendChild(node); });
    sec.appendChild(inner);
    slides.push(sec);
  });

  var idx = 0;
  var progress = document.getElementById('progress');
  var counter = document.getElementById('counter');

  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides[idx].classList.remove('current');
    idx = i;
    slides[idx].classList.add('current');
    progress.style.width = (idx / (slides.length - 1) * 100) + '%';
    counter.textContent = idx + ' / ' + (slides.length - 1);
    if (location.hash !== '#' + idx) history.replaceState(null, '', '#' + idx);
    fit(slides[idx]);
  }

  // Shrink a slide's body until it fits the fixed 720px stage.
  function fit(sec) {
    var inner = sec.querySelector('.slide-inner');
    if (!inner) return;
    var head = sec.querySelector('h1');
    var avail = 720 - 62 - 78 - (head ? head.offsetHeight + 26 : 0);
    var size = 26;
    inner.style.fontSize = size + 'px';
    while (inner.scrollHeight > avail && size > 15) {
      size -= 1;
      inner.style.fontSize = size + 'px';
    }
  }

  function scale() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty('--scale', s);
  }

  // ----- navigation -----
  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (ov.classList.contains('open') && k !== 'o' && k !== 'O' && k !== 'Escape') return;
    // Clicker-standard: Right / Down / PageDown / Space advance, regardless of RTL.
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(slides.length - 1); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'o' || k === 'O') { toggleOverview(); }
    else if (k === 'Escape') { ov.classList.remove('open'); }
  });

  stage.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    next();
  });

  // ----- overview grid -----
  var ov = document.getElementById('overview');
  slides.forEach(function (sec, i) {
    var h = sec.querySelector('h1');
    var card = document.createElement('div');
    card.className = 'ov-card';
    card.innerHTML = '<div class="n">' + (i === 0 ? '—' : i) + '</div>';
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = h ? h.textContent : 'שער';
    card.appendChild(t);
    card.addEventListener('click', function () { ov.classList.remove('open'); show(i); });
    ov.appendChild(card);
  });
  function toggleOverview() { ov.classList.toggle('open'); }

  window.addEventListener('resize', function () { scale(); fit(slides[idx]); });
  scale();
  var start = parseInt((location.hash || '#0').slice(1), 10);
  show(isNaN(start) ? 0 : start);
})();
</script>
</body>
</html>
