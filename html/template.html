<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$he$endif$" dir="$if(dir)$$dir$$else$rtl$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(title-prefix)$$title-prefix$ — $endif$$pagetitle$</title>
  <style>
    :root {
      --ink:        #1a1a2e;
      --muted:      #475569;
      --accent:     #1e40af;
      --accent-2:   #3b82f6;
      --line:       #cbd5e1;
      --line-soft:  #e2e8f0;
      --callout-bg: #eff6ff;
      --callout-br: #3b82f6;
      --code-bg:    #f1f5f9;
      --code-br:    #dbe3ec;
      --paper:      #ffffff;
      --sans: "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "Cascadia Mono", "Consolas", "JetBrains Mono", "SFMono-Regular", "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      color: var(--ink);
      line-height: 1.8;
      font-size: 16.5px;
      margin: 0;
      background: #f8fafc;
    }

    .wrap { display: flex; align-items: flex-start; max-width: 1180px; margin: 0 auto; }

    /* ===== Table of contents ===== */
    #TOC {
      position: sticky;
      top: 0;
      flex: 0 0 272px;
      max-height: 100vh;
      overflow-y: auto;
      padding: 28px 24px 40px;
      font-size: 13.5px;
      line-height: 1.5;
      border-inline-end: 1px solid var(--line-soft);
    }
    #TOC::before {
      content: "תוכן העניינים";
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    #TOC ul { list-style: none; margin: 0; padding: 0; padding-inline-start: 10px; }
    #TOC > ul { padding-inline-start: 0; }
    #TOC li { margin: 0 0 2px; }
    #TOC a {
      display: block;
      padding: 3px 8px;
      color: var(--muted);
      text-decoration: none;
      border-radius: 5px;
      border-inline-start: 2px solid transparent;
    }
    #TOC a:hover { background: var(--callout-bg); color: var(--accent); }
    #TOC > ul > li > a { font-weight: 600; color: var(--ink); }
    #TOC a.active { color: var(--accent); background: var(--callout-bg); border-inline-start-color: var(--accent-2); font-weight: 600; }

    /* ===== Page ===== */
    .page {
      flex: 1 1 auto;
      min-width: 0;
      background: var(--paper);
      padding: 40px 52px 80px;
      border-inline: 1px solid var(--line-soft);
      min-height: 100vh;
    }

    /* ===== Title block ===== */
    .doc-head { border-bottom: 3px solid var(--accent); padding-bottom: 20px; margin-bottom: 32px; }
    .doc-head img { max-width: 210px; height: auto; display: block; margin-bottom: 18px; }
    .doc-head .course { font-size: 12.5px; color: var(--muted); font-weight: 700; letter-spacing: .03em; }
    .doc-head h1.doc-title { font-size: 33px; font-weight: 700; color: var(--accent); margin: 8px 0 0; line-height: 1.25; border: 0; padding: 0; }
    .doc-head .sub { font-size: 17px; color: var(--muted); margin-top: 8px; }
    .doc-head .author { font-size: 13.5px; color: var(--muted); margin-top: 14px; }

    /* ===== Headings ===== */
    h1 {
      font-size: 25px; font-weight: 700; color: var(--accent);
      margin: 46px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--line);
      line-height: 1.35; scroll-margin-top: 20px;
    }
    h2 {
      font-size: 20px; font-weight: 700; color: var(--accent);
      margin: 34px 0 12px; padding-inline-start: 12px; border-inline-start: 5px solid var(--accent-2);
      line-height: 1.4; scroll-margin-top: 20px;
    }
    h3 { font-size: 17px; font-weight: 700; margin: 26px 0 10px; color: var(--ink); scroll-margin-top: 20px; }
    h4 { font-size: 15px; font-weight: 700; margin: 20px 0 8px; color: var(--muted); scroll-margin-top: 20px; }

    p { margin: 0 0 13px; }
    strong { font-weight: 700; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--line-soft); margin: 34px 0; }

    ol, ul { margin: 0 0 14px; padding-inline-start: 26px; padding-inline-end: 0; }
    li { margin-bottom: 7px; }
    li > ul, li > ol { margin-top: 7px; }

    /* ===== Code =====
       Latin code inside Hebrew RTL prose must render left-to-right, otherwise
       punctuation and brackets migrate to the wrong end of the line. */
    code, pre, kbd, samp { direction: ltr; unicode-bidi: isolate; }

    code {
      font-family: var(--mono);
      background: var(--code-bg);
      padding: 1.5px 6px;
      border-radius: 4px;
      font-size: .87em;
      border: 1px solid var(--code-br);
      color: #0f172a;
    }

    pre {
      background: var(--code-bg);
      color: #0f172a;
      padding: 14px 16px;
      border: 1px solid var(--code-br);
      border-radius: 8px;
      overflow-x: auto;
      margin: 0 0 15px;
      font-size: 13.5px;
      line-height: 1.6;
      position: relative;
      text-align: left;
      unicode-bidi: isolate;
    }

    /* A <code> inside a <pre> is only a wrapper - it must never paint its own
       box, in any context. Kept at high specificity so the callout rule below
       cannot bleed into it (that bug rendered prompts as blank coloured bars). */
    pre > code,
    pre code,
    blockquote pre code,
    div.sourceCode pre code {
      background: none !important;
      border: 0 !important;
      padding: 0;
      font-size: 1em;
      color: inherit;
    }
    div.sourceCode { background: none; margin: 0 0 15px; overflow: visible; }
    div.sourceCode pre { margin: 0; }
    pre a.sourceLine, pre .sourceLine a { text-decoration: none; }

    /* Syntax-highlighting palette. Pandoc emits the skylighting span classes,
       but we colour them here instead of importing pandoc's own stylesheet -
       that sheet also carries document rules (a 36em cap on body among them)
       which would override the layout above. NOTE: never write pandoc's
       styles variable literally in this file, even inside a comment - the
       template engine interpolates it anywhere it appears and injects the
       whole default sheet. Tuned for the light code background. */
    pre code span { color: inherit; }
    code span.kw, code span.cf { color: #0550ae; font-weight: 600; }  /* keyword, control flow */
    code span.dt              { color: #953800; }                     /* data type / JSON key */
    code span.st, code span.ss, code span.vs { color: #0a7c3e; }      /* strings */
    code span.dv, code span.bn, code span.fl { color: #0550ae; }      /* numbers */
    code span.co              { color: #6a737d; font-style: italic; } /* comments */
    code span.fu, code span.bu { color: #6f42c1; }                    /* functions, builtins */
    code span.va              { color: #8250df; }                     /* variables */
    code span.op, code span.sc { color: #24292f; }                    /* operators */
    code span.at              { color: #0550ae; }                     /* attributes */
    code span.pp              { color: #953800; }                     /* preprocessor */
    code span.al, code span.er { color: #cf222e; font-weight: 600; }  /* alert, error */
    code span.wa              { color: #9a6700; font-style: italic; } /* warning */
    code span.an, code span.cv, code span.do { color: #6a737d; font-style: italic; }

    /* ===== Callouts / pasteable prompts ===== */
    blockquote {
      margin: 15px 0;
      padding: 14px 18px;
      background: var(--callout-bg);
      border-inline-start: 5px solid var(--callout-br);
      border-radius: 7px;
      border-start-start-radius: 0;
      border-end-start-radius: 0;
      color: #1e3a5f;
      position: relative;
    }
    blockquote > :last-child { margin-bottom: 0; }

    /* A blockquote is either a pasteable prompt (English, blue, gets a Copy
       button) or an explanatory note (Hebrew, amber, no Copy button). The
       distinction is set in JS by looking for Hebrew characters - without it
       every note looks like something the student is meant to paste. */
    blockquote.note {
      background: var(--warn-bg);
      border-inline-start-color: var(--warn-br);
      color: #422006;
    }

    /* An English prompt inside an RTL page must render left-to-right. Without
       this, the paragraph keeps the page's RTL direction and trailing neutral
       runs - a closing `code` span, a full stop - jump to the start of the
       line. Keep the accent bar on the right so prompts still line up with the
       Hebrew notes, and move the Copy button clear of it. */
    main.page blockquote.prompt {
      direction: ltr;
      text-align: left;
      border-inline-start: 0;
      border-inline-end: 5px solid var(--callout-br);
      border-radius: 7px;
      border-start-end-radius: 0;
      border-end-end-radius: 0;
    }
    main.page blockquote.prompt > .copy-btn {
      inset-inline-start: 8px;
      inset-inline-end: auto;
    }
    blockquote.note :not(pre) > code { background: #fef3c7; border-color: #fde68a; }
    /* Inline code only - never the <code> wrapper inside a <pre>. */
    blockquote :not(pre) > code { background: #dbeafe; border-color: #bfdbfe; }
    blockquote pre { background: #fff; border-color: #cfe0f5; }

    /* ===== Copy button ===== */
    .copy-btn {
      position: absolute; top: 7px; inset-inline-end: 8px;
      font-family: var(--sans); font-size: 11.5px; font-weight: 600;
      padding: 3px 10px; border-radius: 5px; cursor: pointer;
      border: 1px solid var(--line); background: #fff; color: var(--muted);
      opacity: 0; transition: opacity .13s ease;
      z-index: 2;
    }
    pre:hover .copy-btn, blockquote:hover .copy-btn, .copy-btn:focus { opacity: 1; }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent-2); }
    .copy-btn.done { color: #15803d; border-color: #86efac; background: #f0fdf4; opacity: 1; }

    /* ===== Tables ===== */
    table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 15px; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--line); padding: 9px 12px; text-align: start; vertical-align: top; }
    thead th { background: var(--accent); color: #fff; font-weight: 600; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    td code { font-size: .84em; }

    img { max-width: 100%; height: auto; }

    /* ===== Narrow screens ===== */
    @media (max-width: 900px) {
      .wrap { display: block; }
      #TOC { position: static; max-height: none; flex: none; width: auto; border-inline-end: 0; border-bottom: 1px solid var(--line-soft); padding: 18px 22px; background: var(--paper); }
      .page { padding: 28px 22px 60px; border: 0; }
    }

    /* ===== Print ===== */
    @media print {
      body { background: #fff; font-size: 10.5pt; line-height: 1.6; }
      .wrap { display: block; max-width: none; }
      #TOC, .copy-btn { display: none; }
      .page { padding: 0; border: 0; min-height: 0; }
      h1 { page-break-before: always; page-break-after: avoid; font-size: 17pt; }
      h1:first-of-type { page-break-before: avoid; }
      h2, h3, h4 { page-break-after: avoid; }
      pre, blockquote, table, li { page-break-inside: avoid; }
      a { color: var(--ink); text-decoration: none; }
      .doc-head { page-break-after: always; padding-top: 22%; text-align: center; border-bottom: 0; }
      .doc-head img { margin: 0 auto 24px; }
    }
  </style>
</head>
<body>
<div class="wrap">
$if(toc)$
<nav id="TOC" role="doc-toc">
$table-of-contents$
</nav>
$endif$
<main class="page">
  <header class="doc-head">
$if(logo)$    <img src="$logo$" alt="">
$endif$$if(course)$    <div class="course">$course$</div>
$endif$    <h1 class="doc-title">$if(title)$$title$$else$$pagetitle$$endif$</h1>
$if(subtitle)$    <div class="sub">$subtitle$</div>
$endif$$if(author)$    <div class="author">$for(author)$$author$$sep$ · $endfor$</div>
$endif$  </header>

$body$
</main>
</div>
<script>
(function () {
  var COPY = 'העתק', DONE = 'הועתק';

  function cleanText(el) {
    var clone = el.cloneNode(true);
    clone.querySelectorAll('.copy-btn').forEach(function (b) { b.remove(); });
    return clone.innerText.trim();
  }

  function addCopy(el, source) {
    var b = document.createElement('button');
    b.className = 'copy-btn';
    b.type = 'button';
    b.textContent = COPY;
    b.addEventListener('click', function () {
      var text = cleanText(source);
      var done = function () {
        b.textContent = DONE;
        b.classList.add('done');
        setTimeout(function () { b.textContent = COPY; b.classList.remove('done'); }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {});
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
    });
    el.appendChild(b);
  }

  document.querySelectorAll('main.page pre').forEach(function (pre) { addCopy(pre, pre); });
  // blockquote.prompt / blockquote.note are assigned at build time, so the page
  // reads correctly before this script runs - and if it never runs.
  document.querySelectorAll('main.page blockquote.prompt').forEach(function (bq) { addCopy(bq, bq); });

  // Highlight the TOC entry for the section currently on screen.
  var links = Array.prototype.slice.call(document.querySelectorAll('#TOC a[href^="#"]'));
  if (!links.length) return;
  var byId = {}, targets = [];
  links.forEach(function (a) {
    var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    if (el) { byId[el.id] = a; targets.push(el); }
  });
  var current = null;
  function onScroll() {
    var best = null;
    for (var i = 0; i < targets.length; i++) {
      if (targets[i].getBoundingClientRect().top <= 90) best = targets[i]; else break;
    }
    if (!best) best = targets[0];
    if (best === current) return;
    current = best;
    links.forEach(function (a) { a.classList.remove('active'); });
    if (byId[best.id]) byId[best.id].classList.add('active');
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
